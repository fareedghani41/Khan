
name: FG JARVIS Automatic APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -o FG-Jarvis-v0.2.zip -d extracted

      - name: Find Android Project
        run: |
          find extracted -name gradlew -exec dirname {} \; > project_path.txt
          if [ ! -s project_path.txt ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

      - name: Build APK
        run: |
          PROJECT=$(head -n 1 project_path.txt)
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-JARVIS-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
